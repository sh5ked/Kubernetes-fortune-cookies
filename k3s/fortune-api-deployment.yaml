apiVersion: apps/v1
kind: Deployment

metadata:
  name: fortune-api

spec:
  replicas: 3

  selector:
    matchLabels:
      app: fortune-api

  template:
    metadata:
      labels:
        app: fortune-api

    spec:
      containers:
        - name: fortune-api
          image: fortune-api:v1
          imagePullPolicy: Never

          ports:
            - containerPort: 3000

          env:
            - name: APP_VERSION
              value: "v1"