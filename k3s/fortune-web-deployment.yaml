apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortune-web

spec:
  replicas: 2

  selector:
    matchLabels:
      app: fortune-web

  template:
    metadata:
      labels:
        app: fortune-web

    spec:
      containers:
        - name: fortune-web
          image: fortune-web:v1
          imagePullPolicy: Never

          ports:
            - containerPort: 80